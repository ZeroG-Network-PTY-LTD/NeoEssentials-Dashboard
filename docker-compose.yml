services:
  dashboard:
    build: .
    ports:
      - "8000:8000"
    networks:
      - cloudflare-shared
    environment:
      # Point at your NeoEssentials server's dashboard API. Use host.docker.internal
      # if the mod runs on the same machine as Docker (Linux: add
      # "extra_hosts: - host.docker.internal:host-gateway" below).
      # ${MC_API_URL} lets a local .env override this without touching the tracked default —
      # e.g. this host's mod listens on :8099, not :8090, because :8090 is squatted by an
      # unrelated ledgerline-ntfy container here. Pointed at the wrong port, this silently hit
      # ntfy's own API instead (same {"error": "..."} JSON shape ours uses), surfacing ntfy's
      # own auth-rate-limit text ("too many auth failures") as if it came from the mod.
      MC_API_URL: "${MC_API_URL:-http://host.docker.internal:8090}"
      # Without this it defaults to bare "http://localhost" (no port) — the pairing code
      # Configuration generates (`/dashboard pair "<APP_URL>" <code>`) embeds this exact
      # value, and the mod (running on the HOST, not in this container) tries to reach it
      # directly, so a portless URL just fails with "Could not reach the dashboard". This is
      # the reverse direction from MC_API_URL above: that's this container reaching OUT to
      # the host's mod port, this is the mod reaching IN to this container's published port.
      # Change to your actual externally-reachable address/domain for a real deployment.
      APP_URL: "https://dashboard.zerognetwork.co.za"
      # Pairing credentials (API key, webhook token, WS port) live in the mc_connection DB
      # table, not env vars — persisted by the dashboard-data volume below across restarts.
      #
      # APP_KEY: the Dockerfile bakes a FRESH RANDOM key into the image on every build
      # (it needs one to boot at all) — that key is NOT covered by the volumes below, so
      # rebuilding the image (e.g. to pick up an app update) silently generates a new one.
      # Since mc_connection.api_key above is an encrypted column, the OLD key's ciphertext
      # then becomes permanently undecryptable under the NEW key, which used to 500 the
      # entire app (every page resolves MinecraftApiService) until it was made to fail soft
      # as "not paired" instead. Still: to avoid having to re-pair after every rebuild,
      # generate one real key ONCE (`php artisan key:generate --show`) and set it here — a
      # value supplied here always wins over whatever got baked in at build time.
      APP_KEY: "${APP_KEY}"
      # The SQLite DB file lives under storage/ (persisted by dashboard-storage below), not
      # database/ — see the volumes comment below for why.
      DB_DATABASE: "/app/storage/app/database.sqlite"
    volumes:
      # Persist Laravel's writable storage dir (now including the SQLite DB itself, via
      # DB_DATABASE above) across container restarts/rebuilds. Does NOT cover APP_KEY — see
      # above. This used to ALSO have `dashboard-data:/app/database`, mounting the whole
      # database/ directory — that shadowed the image's baked-in database/migrations/ with
      # whatever was in the volume from the container's first ever start, so any migration
      # added to the repo after that silently never ran (no error; migrate:status just never
      # listed it). A volume mounted on the single file instead (`:/app/database/
      # database.sqlite`) was tried next but this Docker Desktop/Windows setup doesn't
      # reliably auto-create file-type named volumes ("not a directory" mount error even on
      # a fresh volume). Moving the DB file into storage/ sidesteps both: storage/ was
      # already a full-directory volume mount and never has new versioned files added to it
      # at build time the way database/migrations/ does, so there's nothing for it to shadow.
      - dashboard-storage:/app/storage

networks:
  # Pre-created externally (docker network create cloudflare-shared) — NOT managed by this
  # compose file. Shared with D:\docker\forgejo\docker-compose.yml's cloudflared service, which
  # is the ONLY connector for this tunnel/token now. A second, dashboard-only cloudflared
  # container used to live in this file, but Cloudflare's edge load-balances every request
  # across every connector registered under one token, and a connector that could only reach
  # its own stack's network failed ~50% of requests meant for either site. Joining this one
  # network lets Forgejo's single connector resolve and reach "dashboard" by name too.
  cloudflare-shared:
    external: true

volumes:
  dashboard-storage: