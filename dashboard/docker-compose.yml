services:
  dashboard:
    build: .
    ports:
      - "8000:8000"
    networks:
      - dashboard-net
    environment:
      # Point at your NeoEssentials server's dashboard API. Use host.docker.internal
      # if the mod runs on the same machine as Docker (Linux: add
      # "extra_hosts: - host.docker.internal:host-gateway" below).
      MC_API_URL: "http://host.docker.internal:8090"
      # Without this it defaults to bare "http://localhost" (no port) — the pairing code
      # Configuration generates (`/dashboard pair "<APP_URL>" <code>`) embeds this exact
      # value, and the mod (running on the HOST, not in this container) tries to reach it
      # directly, so a portless URL just fails with "Could not reach the dashboard". This is
      # the reverse direction from MC_API_URL above: that's this container reaching OUT to
      # the host's mod port, this is the mod reaching IN to this container's published port.
      # Change to your actual externally-reachable address/domain for a real deployment.
      APP_URL: "http://localhost:8000"
      # Pairing credentials (API key, webhook token, WS port) live in the mc_connection DB
      # table, not env vars — persisted by the dashboard-data volume below across restarts.
      #
      # APP_KEY: the Dockerfile bakes a FRESH RANDOM key into the image on every build
      # (it needs one to boot at all) — that key is NOT covered by the volumes below, so
      # rebuilding the image (e.g. to pick up an app update) silently generates a new one.
      # Since mc_connection.api_key above is an encrypted column, the OLD key's ciphertext
      # then becomes permanently undecryptable under the NEW key, which used to 500 the
      # entire app (every page resolves MinecraftApiService) until it was made to fail soft
      # as "not paired" instead. Still: to avoid having to re-pair after every rebuild,
      # generate one real key ONCE (`php artisan key:generate --show`) and set it here — a
      # value supplied here always wins over whatever got baked in at build time.
      # APP_KEY: "base64:...replace-with-a-real-generated-key..."
    volumes:
      # Persist the SQLite DB (including mc_connection's pairing) and Laravel's writable
      # storage dirs across container restarts/rebuilds. Does NOT cover APP_KEY — see above.
      - dashboard-data:/app/database
      - dashboard-storage:/app/storage

  # Mirrors the Forgejo stack's own cloudflared service (D:\docker\forgejo\docker-compose.yml)
  # — same image, same token-based `tunnel run` (no local ingress config.yml; the public
  # hostname -> internal service mapping is configured on the Cloudflare Zero Trust dashboard
  # side, pointing the new "dashboard" public hostname at http://dashboard:8000, the container's
  # name on this same compose network). TUNNEL_TOKEN comes from a .env file next to this compose
  # file (gitignored — see .gitignore), same convention as Forgejo's TUNNEL_TOKEN/POSTGRES_PASSWORD.
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    depends_on:
      - dashboard
    networks:
      - dashboard-net

networks:
  dashboard-net:

volumes:
  dashboard-data:
  dashboard-storage: