name: Dashboard — build installer/updater packages

# Builds both dist/*_installer.zip and *-updater.zip (see bin/build-installer.ps1)
# and publishes them as a NEW, uniquely-tagged GitHub Release per build
# (dashboard-<shortsha>) — not a single rolling release. Each one is kept
# permanently, so the repo's Releases page doubles as the version history, and
# the dashboard's own Updates page can offer a "downgrade to an older version"
# picker built from that same list (SelfUpdateService::listGithubReleases()).
# The newest build is flagged make_latest, so /releases/latest — what
# SelfUpdateService::checkGithubRelease() checks for the *recommended*
# update — always resolves to it without any extra bookkeeping.
#
# Runs on windows-latest for parity with how a maintainer would run the script
# locally — build-installer.ps1 itself is cross-platform (runs under `pwsh`
# with no Windows-only dependencies), and also runs on the Linux-based Forgejo
# mirror's own equivalent workflow.
#
# Repo layout: this app used to live under a dashboard/ subfolder (a leftover
# from when this repo also staged two now-unused placeholder sites); it was
# flattened to the repo root since nothing else ever used those paths.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          # Matches composer.json's require.php — composer.lock is actually
          # resolved against Symfony 8.0.x, which needs PHP >=8.4.
          php-version: '8.4'
          extensions: mbstring, pdo, pdo_sqlite, curl, fileinfo, zip, ctype, json, tokenizer, openssl
          tools: composer:v2

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Compute short SHA
        id: vars
        shell: bash
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build installer package
        shell: pwsh
        run: ./bin/build-installer.ps1 -Kind installer -Version "${{ steps.vars.outputs.sha }}"

      - name: Build updater package
        shell: pwsh
        run: ./bin/build-installer.ps1 -Kind updater -Version "${{ steps.vars.outputs.sha }}"

      - name: Publish dated release
        id: publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dashboard-${{ steps.vars.outputs.sha }}
          name: Dashboard ${{ steps.vars.outputs.sha }}
          body: |
            Built from commit ${{ github.sha }} on `main`.

            - `*_installer.zip` — fresh deploy to shared/cPanel hosting (see INSTALL.md)
            - `*-updater.zip` — available from the dashboard's own Updates page (as the recommended
              update if this is the newest release, or under "choose a version" otherwise)
          make_latest: true
          prerelease: false
          files: |
            dist/*_installer.zip
            dist/*-updater.zip

      # Separate from the mod workflow's own Discord step/secret, and from this repo's
      # general commits/events channel (already covered by GitHub's own native repo
      # webhook on the `release` event) — this posts to the dashboard's own releases
      # channel specifically. continue-on-error: a Discord outage shouldn't fail the release.
      - name: Post release to Discord
        continue-on-error: true
        shell: bash
        env:
          DISCORD_RELEASES_WEBHOOK_URL: ${{ secrets.DISCORD_RELEASES_WEBHOOK_URL }}
          TAG: dashboard-${{ steps.vars.outputs.sha }}
          HTML_URL: ${{ steps.publish.outputs.url }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "$DISCORD_RELEASES_WEBHOOK_URL" ]; then
            echo "DISCORD_RELEASES_WEBHOOK_URL not set - skipping Discord notification."
            exit 0
          fi

          TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          payload=$(TIMESTAMP="$TIMESTAMP" node -e "
            const fs = require('fs');
            const files = fs.readdirSync('dist').filter(f => f.endsWith('.zip'));
            const base = 'https://github.com/' + process.env.REPO + '/releases/download/' + process.env.TAG + '/';
            const lines = files.map(f => '[' + f + '](' + base + encodeURIComponent(f) + ')').join('\n');
            console.log(JSON.stringify({
              embeds: [{
                author: { name: 'NeoEssentials Dashboard (GitHub)' },
                title: '🆕 Release',
                color: 5793266,
                url: process.env.HTML_URL,
                description: '**' + process.env.TAG + '**\n' + lines,
                timestamp: process.env.TIMESTAMP
              }]
            }));
          ")

          curl -sS -f \
            -H "Content-Type: application/json" \
            -d "$payload" \
            "$DISCORD_RELEASES_WEBHOOK_URL"
